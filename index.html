<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f3efe6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kitchen Hub">
  <title>Kitchen Hub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=202611040915">
</head>
<body class="theme-day">
  <div id="root">
    <section id="alerts" class="alerts is-empty" aria-label="Weather alerts" hidden></section>

    <div class="hero">
      <div class="hero-clock">
        <section id="clock" class="clock" aria-label="Clock">
          <div class="clock-time">
            <span id="clock-hhmm">--:--</span>
            <span id="clock-ampm" class="clock-ampm"></span>
          </div>
          <div id="clock-date" class="clock-date"></div>
        </section>
        <section id="scores" class="scores" aria-label="Today's games" hidden></section>
      </div>

      <section id="current" class="current" aria-label="Current weather">
        <div class="placeholder-copy">Loading weather…</div>
      </section>
    </div>

    <div id="stage" class="stage">
      <section id="hourly" class="hourly" aria-label="Hourly forecast">
        <div class="panel-kicker">Next 12 hours</div>
      </section>

      <section id="daily" class="daily" aria-label="Five day forecast"></section>

      <section id="news" class="news" aria-label="News"></section>
    </div>

    <footer id="status" class="status" aria-label="Update status">
      <span id="status-times">Weather — · News —</span>
      <span id="offline-pill" class="offline-pill" hidden>Offline, showing cached data</span>
    </footer>
  </div>
  <div id="news-detail" class="news-modal" aria-label="Story detail" hidden></div>
  <div id="day-detail" class="day-modal" aria-label="Day forecast" hidden></div>
  <div id="map-detail" class="day-modal map-modal" aria-label="Weather map" hidden></div>
  <div id="debug" class="debug" hidden></div>

  <script src="config.js?v=202610242310"></script>
  <script src="js/util.js?v=202611080645"></script>
  <script src="js/icons.js?v=202610211245"></script>
  <script src="js/weather.js?v=202611021420"></script>
  <script src="js/alerts.js?v=202610211245"></script>
  <script src="js/news.js?v=202611080645"></script>
  <script src="js/scores.js?v=202610242310"></script>
  <script src="js/presence.js?v=202611080645"></script>
  <script src="js/app.js?v=202611080645"></script>
</body>
</html>
